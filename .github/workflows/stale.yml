name: 🧹 Manage Stale Issues & PRs

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity. It will be closed in 7 days if no further activity occurs. Thank you for your contributions to the ESP32 Community!'
          stale-pr-message: 'This pull request has been automatically marked as stale due to inactivity. It will be closed in 7 days if no updates are pushed.'
          days-before-stale: 60
          days-before-close: 7
          exempt-issue-labels: 'pinned,security,enhancement,help-wanted'
          exempt-pr-labels: 'work-in-progress,pinned'
