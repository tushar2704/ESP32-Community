name: 🛠️ PlatformIO Firmware Build Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile ESP32 Projects
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cache PlatformIO & Core Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: ⚡ Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: 🔍 Find & Compile PlatformIO Projects
        run: |
          echo "Scanning for PlatformIO projects..."
          FAILED=0
          COUNT=0

          while IFS= read -r -d '' piofile; do
            DIR=$(dirname "$piofile")
            echo "=================================================="
            echo "🔨 Compiling project in: $DIR"
            echo "=================================================="
            COUNT=$((COUNT+1))
            if ! (cd "$DIR" && pio run); then
              echo "❌ Build FAILED: $DIR"
              FAILED=$((FAILED+1))
            else
              echo "✅ Build PASSED: $DIR"
            fi
          done < <(find projects library -name "platformio.ini" -print0)

          echo "=================================================="
          echo "📊 Build Summary: $COUNT projects checked, $FAILED failures."
          echo "=================================================="

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi
