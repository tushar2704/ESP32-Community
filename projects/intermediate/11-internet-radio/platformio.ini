[platformio]
default_envs = esp32dev
src_dir = .

[env]
platform = espressif32 @ 6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    esphome/ESP32-audioI2S @ 2.0.7

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1
