[platformio]
default_envs = esp32dev
src_dir = .

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.4

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1
